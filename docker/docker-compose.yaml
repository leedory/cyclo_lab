# Keep Cyclo Lab resources isolated from other repositories whose Compose files
# also live in a directory named "docker".
name: cyclo_lab

# Extension fields for reusable configurations
x-default-cyclo-lab-volumes: &default-cyclo-lab-volumes
  # Isaac Sim cache volumes
  - type: volume
    source: isaac-cache-kit
    target: ${DOCKER_ISAACSIM_ROOT_PATH}/kit/cache
  - type: volume
    source: isaac-cache-ov
    target: ${DOCKER_USER_HOME}/.cache/ov
  - type: volume
    source: isaac-cache-pip
    target: ${DOCKER_USER_HOME}/.cache/pip
  - type: volume
    source: isaac-cache-gl
    target: ${DOCKER_USER_HOME}/.cache/nvidia/GLCache
  - type: volume
    source: isaac-cache-compute
    target: ${DOCKER_USER_HOME}/.nv/ComputeCache
  - type: volume
    source: isaac-logs
    target: ${DOCKER_USER_HOME}/.nvidia-omniverse/logs
  - type: volume
    source: isaac-carb-logs
    target: ${DOCKER_ISAACSIM_ROOT_PATH}/kit/logs/Kit/Isaac-Sim
  - type: volume
    source: isaac-data
    target: ${DOCKER_USER_HOME}/.local/share/ov/data
  - type: volume
    source: isaac-docs
    target: ${DOCKER_USER_HOME}/Documents
  # Bind mount the Cyclo Lab repository so source files and Git state match the host checkout.
  - type: bind
    source: ../
    target: ${DOCKER_CYCLOLAB_PATH}
  # Isaac Lab volumes for artifacts (third_party/IsaacLab)
  - type: volume
    source: isaac-lab-docs
    target: ${DOCKER_ISAACLAB_PATH}/docs/_build
  - type: volume
    source: isaac-lab-logs
    target: ${DOCKER_ISAACLAB_PATH}/logs
  - type: volume
    source: isaac-lab-data
    target: ${DOCKER_ISAACLAB_PATH}/data_storage
  # Bash history
  - type: bind
    source: .cyclo-lab-docker-history
    target: ${DOCKER_USER_HOME}/.bash_history
  # Zenoh shared memory transport and message-definition cache
  - type: bind
    source: /dev/shm
    target: /dev/shm
  - type: bind
    source: ./zenoh_cache
    target: ${DOCKER_USER_HOME}/.cache/zenoh_ros2_sdk

x-default-cyclo-lab-environment: &default-cyclo-lab-environment
  - ISAACSIM_PATH=${DOCKER_ISAACSIM_ROOT_PATH}
  - ISAACLAB_PATH=${DOCKER_ISAACLAB_PATH}
  - CYCLOLAB_PATH=${DOCKER_CYCLOLAB_PATH}
  - OMNI_KIT_ALLOW_ROOT=1
  - ACCEPT_EULA=${ACCEPT_EULA}
  - PRIVACY_CONSENT=Y
  - NVIDIA_VISIBLE_DEVICES=all
  - NVIDIA_DRIVER_CAPABILITIES=all
  - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-31}
  - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
  - ZENOH_ROUTER_IP=${ZENOH_ROUTER_IP:-127.0.0.1}
  - ZENOH_ROUTER_PORT=${ZENOH_ROUTER_PORT:-7448}
  - ZENOH_CONFIG_OVERRIDE=${ZENOH_CONFIG_OVERRIDE:-transport/shared_memory/enabled=true;mode="client";connect/endpoints=["tcp/127.0.0.1:7448"]}
  - ZENOH_SDK_PATH=${DOCKER_CYCLOLAB_PATH}/third_party/zenoh_ros2_sdk

x-default-cyclo-lab-deploy: &default-cyclo-lab-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [ gpu ]

services:
  cyclo_lab:
    profiles: [ "base" ]
    env_file: .env.base
    image: robotis/cyclo-lab${DOCKER_NAME_SUFFIX}:latest
    container_name: cyclo_lab${DOCKER_NAME_SUFFIX}
    build:
      context: ../
      dockerfile: docker/Dockerfile.base
      args:
        - ISAACSIM_BASE_IMAGE_ARG=${ISAACSIM_BASE_IMAGE}
        - ISAACSIM_VERSION_ARG=${ISAACSIM_VERSION}
        - ISAACSIM_ROOT_PATH_ARG=${DOCKER_ISAACSIM_ROOT_PATH}
        - CYCLOLAB_PATH_ARG=${DOCKER_CYCLOLAB_PATH}
        - DOCKER_USER_HOME_ARG=${DOCKER_USER_HOME}
      network: host
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    privileged: true
    volumes: *default-cyclo-lab-volumes
    environment: *default-cyclo-lab-environment
    depends_on:
      sg2_sim_zenoh_router:
        condition: service_healthy
    deploy: *default-cyclo-lab-deploy

  sg2_sim_zenoh_router:
    image: robotis/cyclo-intelligence:1.3.1
    container_name: sg2_sim_zenoh_router
    entrypoint:
      - /bin/bash
      - -c
      - source /opt/ros/jazzy/setup.bash && exec /opt/ros/jazzy/lib/rmw_zenoh_cpp/rmw_zenohd
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "31"
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: 'mode="router";listen/endpoints=["tcp/127.0.0.1:7448"];transport/shared_memory/enabled=false'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/7448'"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  isaac-cache-kit:
  isaac-cache-ov:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-logs:
  isaac-carb-logs:
  isaac-data:
  isaac-docs:
  isaac-lab-docs:
  isaac-lab-logs:
  isaac-lab-data:
